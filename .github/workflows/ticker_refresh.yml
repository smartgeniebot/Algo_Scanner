name: NSE Ticker Refresh

on:
  schedule:
    # Runs on the 1st of every month at 00:30 UTC (06:00 AM IST)
    # Clear of all other jobs: market_engine (01:00 AM IST), bhavcopy_engine (04:00 AM IST)
    - cron: '30 0 1 * *'
  workflow_dispatch:

jobs:
  refresh-tickers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run NSE Ticker Refresh
        env:
          NEON_URL: ${{ secrets.NEON_URL }}
        run: python nse_ticker_refresh.py
