name: NSE Ticker Refresh

on:
  workflow_dispatch:

jobs:
  refresh-tickers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run NSE Ticker Refresh
        env:
          NEON_URL: ${{ secrets.NEON_URL }}
        run: python nse_ticker_refresh.py
