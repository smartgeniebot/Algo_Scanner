name: Chart Hawks Early Weekly Base Engine

on:
  schedule:
    # Runs at 22:30 UTC (04:00 AM IST) daily — after first_daily_base_engine (02:00 AM IST)
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Lookback window in days for pullback signal cutoff'
        required: false
        default: '30'

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Early Weekly Base Scan
        env:
          NEON_URL: ${{ secrets.NEON_URL }}
        run: |
          python triple_ema_scan.py \
            --mode weekly_base \
            --lookback-days ${{ github.event.inputs.lookback_days || '30' }}
