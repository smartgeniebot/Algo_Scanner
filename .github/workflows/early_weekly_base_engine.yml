name: Chart Hawks Early Weekly Base Engine

on:
  schedule:
    # Runs at 21:00 UTC (02:30 AM IST next day)
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Lookback window in days for pullback signal cutoff'
        required: false
        default: '30'

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Auto Login
        env:
          FYERS_ID: ${{ secrets.FYERS_ID }}
          TOTP_KEY: ${{ secrets.TOTP_KEY }}
          PIN: ${{ secrets.PIN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: python auth.py

      - name: Early Weekly Base Scan
        env:
          NEON_URL: ${{ secrets.NEON_URL }}
        run: python triple_ema_scan.py --mode weekly_base --lookback-days ${{ github.event.inputs.lookback_days || '30' }}
