name: Chart Hawks Bhavcopy Engine

on:
  schedule:
    # Runs at 22:30 UTC daily (04:00 AM IST) — after NSE publishes Bhavcopy (~6-7pm IST)
    - cron: '30 22 * * *'
  workflow_dispatch:

jobs:
  fetch-bhavcopy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: 📦 Fetch NSE Bhavcopy Delivery Data
        env:
          NEON_URL: ${{ secrets.NEON_URL }}
        run: python bhavcopy_fetch.py
