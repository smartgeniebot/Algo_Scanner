name: Chart Hawks 1st Daily Base Engine

on:
  schedule:
    # Runs at 20:30 UTC (02:00 AM IST next day) — reads from daily_ohlcv cache populated by market_engine
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Lookback window in days for base signal cutoff'
        required: false
        default: '30'

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: 1st Daily Base Scan
        env:
          NEON_URL: ${{ secrets.NEON_URL }}
        run: python triple_ema_scan.py --lookback-days ${{ github.event.inputs.lookback_days || '30' }}
