name: Chart Hawks 1st Daily Base Engine

on:
  schedule:
    # Runs at 20:30 UTC (02:00 AM IST next day) — job 3 of 3, 4 hrs after sector_rs_engine (10:00 PM IST)
    - cron: '30 20 * * *'
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: 🔐 Step 1 - Auto Login
        env:
          FYERS_ID: ${{ secrets.FYERS_ID }}
          TOTP_KEY: ${{ secrets.TOTP_KEY }}
          PIN: ${{ secrets.PIN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: python auth.py

      - name: 🔍 Step 2 - 1st Daily Base Scan
        env:
          NEON_URL: ${{ secrets.NEON_URL }}
        run: python triple_ema_scan.py
