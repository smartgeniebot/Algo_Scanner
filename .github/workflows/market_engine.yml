name: Chart Hawks Morning Engine

on:
  schedule:
    # Runs at 12:30 UTC (06:00 PM IST) Mon-Fri
    - cron: '30 12 * * 1-5'
  workflow_dispatch: # This adds a "Run Now" button for testing!

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔐 Step 1 - Auto Login
        env:
          # This maps your GitHub Secrets to the script
          FYERS_ID: ${{ secrets.FYERS_ID }}
          TOTP_KEY: ${{ secrets.TOTP_KEY }}
          PIN: ${{ secrets.PIN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: python auth.py

      - name: 🚀 Step 2 - Market Scan
        env:
          NEON_URL: ${{ secrets.NEON_URL }}
        run: python manual_scan.py